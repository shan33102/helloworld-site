<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World！| 我的第一个 AI 开发的网站</title>
  <meta name="description" content="使用 Node.js 开发的第一个 HelloWorld 网站，已适配电脑与手机。" />
  <meta name="theme-color" content="#4f46e5" />
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <p class="badge">Node.js · 已适配 Vercel 部署</p>

    <h1 class="title">Hello World！</h1>

    <!-- 👇 这里就是你的名字，想改随时改这一处 -->
    <p class="intro">
      我是<span class="name">李珊珊</span>，我的第一个 AI 开发的网站。
    </p>

    <section class="clock" aria-live="polite">
      <p class="clock-label">
        服务器时间
        <span class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">正在同步…</span>
        </span>
      </p>

      <p class="clock-time" id="clock-time">--:--:--</p>
      <p class="clock-date" id="clock-date">正在获取时间…</p>
      <p class="clock-zone">时区：Asia/Shanghai（北京时间）</p>
    </section>

    <footer class="footer">
      由 Node.js 驱动 · 每一秒自动刷新
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
